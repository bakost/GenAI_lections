name: Python Tests (3_1_LLM_agent)

on:
  push:
    paths:
      - '3_1_LLM_agent/**'
      - '.github/workflows/python-tests.yml'
  pull_request:
    paths:
      - '3_1_LLM_agent/**'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        working-directory: 3_1_LLM_agent
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        working-directory: 3_1_LLM_agent
        run: |
          coverage run -m pytest tests/ -v
          coverage report -m

      - name: Generate coverage badge
        working-directory: 3_1_LLM_agent
        run: coverage-badge -o coverage.svg -f

      - name: Commit updated coverage badge
        if: github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update coverage badge [skip ci]"
          file_pattern: 3_1_LLM_agent/coverage.svg
